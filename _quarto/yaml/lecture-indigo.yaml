# lecture-indigo — 講義用 revealjs＋pdf (lualatex)＋html (配色: indigo-palette)
# 使い方: org の先頭で  #+SETUPFILE: _quarto/org/lecture-indigo.org   (lecture.org は lecture-indigo.org へのリンク)
#   (プロジェクトに _quarto と _extensions をシンボリックリンクで置く．ox-quarto/README.org)
# 全 palette 共通の構成で，違うのは revealjs の配色 (と dracula の title-bg・highlight)．pdf と html は配色によらない．
# talk-*.yaml との違い: 表紙に title-bg，節扉は見出しをそのまま出す (section-toc なし)，PDF と html も出せる．
license: "CC BY-NC"
csl: _quarto/csl/apa.csl            # 文献の書式 (本文は (著者, 年))
link-citations: true
cite-aside-max: 2                   # 引用が 3 件以上のスライドでは書誌を脚注欄に出さない (lib/cite-aside.lua)
format:
  revealjs: 
    theme:
      - default
      - _quarto/scss/oerreveal.scss          # structure
      - _quarto/scss/indigo-palette.scss    # 配色 (indigo / jade / lavender / burgundy / dracula)
      - _quarto/scss/lecture-deck.scss       # decoration (+ line-deck / logo-deck)
      - _quarto/scss/parts.scss              # 部品: .muted .kpi .flow-arrow .formulation など
      - _quarto/scss/iframe.scss
      - _quarto/scss/title-bg.scss
      - _quarto/scss/text-size.scss
    slide-level: 3
    max-scale: 2.0 
    embed-resources: true
    include-in-header:
      - _quarto/lib/mathjax-fix.html
      - _quarto/lib/pixel-snap.html     # スライドの位置を整数ピクセルに (Safari のぼやけ対策)
    center: true
    controls: true
    controls-layout: bottom-right
    controls-back-arrows: visible
    controls-tutorial: true
    navigation-mode: vertical
    auto-stretch: false
    slide-number: c/t                  # 右下に「頁/総頁」(talk と同じ)
  pdf:
    keep-tex: true
    echo: false
    pdf-engine: lualatex
    include-in-header: 
      - text: |
          \usepackage{luatexja-preset}
          \usepackage{mathtools}
          \mathtoolsset{showonlyrefs,showmanualtags}	    
      - _quarto/tex/fig-scale.tex
      - _quarto/tex/table-center.tex
      - _quarto/tex/callout-title-gothic.tex
      - _quarto/tex/gt-table-tight.tex
  html: 
    self-contained: false
    grid: 
      margin-width: 350px
    code-fold: true
revealjs-plugins:
  - pointer
pointer:
  color: "rgba(255, 0, 0, 0.4)"
  pointerSize: 120
  alwaysVisible: false
knitr:
  opts_chunk:
    fig.align: center
execute:
  warning: false
  message: false
  fig-height: 5
  fig-width: 5
filters:                          # 節扉は見出しをそのまま出す (section-toc は使わない)
  - _quarto/lib/no-hrule.lua
  - _quarto/lib/iframe.lua
  - _quarto/lib/cite-aside.lua    # 各スライドで引用した文献の書誌を脚注欄に出す (revealjs のみ)
  - _quarto/lib/text-size.lua   # .text-NN / .math-NN を PDF でも効かせる
