# report-typst — 解説文・報告書 (html を主とし，typst で PDF も出せる)
# 使い方: org の先頭で  #+SETUPFILE: _quarto/org/report-typst.org   (report.org は report-latex.org へのリンク)
#   html: quarto render X.qmd --to html / PDF: quarto render X.qmd --to typst
# R のチャンクは図をそのまま使えるよう execute: echo: false
# 文献の表記を英語 (APA) にするため lang は設定せず，見出しの語だけ日本語にする
# typst では csl のパスの _ を扱えないため，文献の書式は typst 内蔵の apa (bibliographystyle)
language:
  title-block-author-single: 著者
  title-block-author-plural: 著者
  title-block-published: 公開日
  toc-title-document: 目次
  section-title-references: 参考文献
  section-title-appendices: 付録
  section-title-footnotes: 脚注
  crossref-fig-title: 図
  crossref-tbl-title: 表
  crossref-eq-prefix: 式
  crossref-thm-title: 定理
  crossref-thm-prefix: 定理
  crossref-lem-title: 補題
  crossref-lem-prefix: 補題
  crossref-cor-title: 系
  crossref-cor-prefix: 系
  crossref-prp-title: 命題
  crossref-prp-prefix: 命題
  crossref-def-title: 定義
  crossref-def-prefix: 定義
  crossref-exm-title: 例
  crossref-exm-prefix: 例
callout-palette: indigo             # html と typst の callout の役割の色 (lib/callout-colors.lua．org の #+QUARTO_PALETTE で替えられる)
license: "CC BY-NC"
number-sections: true
link-citations: true
format:
  html:
    csl: _quarto/csl/apa.csl
    toc: true
    toc-depth: 3
    toc-title: 目次
    embed-resources: true
    html-math-method: mathjax
    fig-width: 6.5
    fig-height: 4.2
    citations-hover: true
    reference-location: margin
    fig-cap-location: bottom
    tbl-cap-location: top
    theme: default
    format-links: false
    fontsize: 1rem
    mainfont: '"Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans JP", "Noto Sans CJK JP", sans-serif'
  typst:
    bibliographystyle: apa         # typst 組み込みの APA (csl のパスの _ を typst が扱えないため)
    include-in-header:
      - text: |
          #set bibliography(title: none)
    # ↑ typst は文献の一覧を文書の最後に自分の見出し ("Bibliography") 付きで置くので，
    #   その見出しを消し，org 側の「参考文献」の見出し (::: {#refs} を置いた節) を使う
    papersize: a4
    margin:
      x: 2.2cm
      y: 2.4cm
    mainfont: "Noto Serif CJK JP"
    fontsize: 10pt
    toc: true
    toc-title: 目次
    fig-width: 6
    fig-height: 3.8
knitr:
  opts_chunk:
    fig.align: center
    out.width: "85%"
    dev: png
    dpi: 160
execute:
  echo: false
  warning: false
  message: false
filters:
  - _quarto/lib/text-center.lua   # #+begin_center (::: {.text-center}) を html / pdf / typst で中央寄せに
  - _quarto/lib/callout-colors.lua # callout を palette の役割の色に (pdf / html / typst の太字．revealjs は scss)
  - quarto                          # ここから後は Quarto の処理の後に走る
  - _quarto/lib/callout-colors-typst.lua # typst の callout の枠・印・題の帯の色 (Quarto が書き出した色を置き換える)
