# talk-burgundy-pin — 講演用 revealjs (配色: burgundy-palette)
# talk-burgundy.yaml の見出し固定版: 違いは theme の pin-deck.scss の 1 行だけ．
# 大元の org に  #+QUARTO_VARIANT: pin  と書くと talk-burgundy.yaml の代わりに読まれる (lisp/ox-quarto-ext-variant.el)．
# talk-burgundy.yaml を直したら make -C samples pin-yaml (tools/mkpin.py) で作り直す．
# 使い方: org の先頭で  #+SETUPFILE: _quarto/org/talk-burgundy.org
#   (プロジェクトに _quarto と _extensions をシンボリックリンクで置く．ox-quarto/README.org)
# 全 palette 共通の構成で，違うのは配色 (と dracula の highlight) だけ．
license: "CC BY-NC"
csl: _quarto/csl/apa.csl            # 文献の書式 (本文は (著者, 年))
link-citations: true
cite-aside-max: 2                   # 引用が 3 件以上のスライドでは書誌を脚注欄に出さない (lib/cite-aside.lua)
format:
  revealjs:
    theme:
      - default
      - _quarto/scss/oerreveal.scss          # 構造
      - _quarto/scss/burgundy-palette.scss  # 配色
      - _quarto/scss/lecture-deck.scss       # 修飾: 外部リンクの ↗ など
      - _quarto/scss/line-deck.scss          # 修飾: 見出しの下線と表の罫線 (logo-deck と択一)
      - _quarto/scss/pin-deck.scss           # 修飾: 見出しを上に固定し，本文だけを中央に
      - _quarto/scss/parts.scss              # 部品: .muted .kpi .flow-arrow .formulation など
      - _quarto/scss/iframe.scss
      - _quarto/scss/text-size.scss          # .text-NN / .math-NN
      - _quarto/scss/section-toc.scss        # 梗概と節扉の一覧 (lib/section-toc.lua)
    slide-level: 3
    max-scale: 2.0
    embed-resources: true
    include-in-header:
      - _quarto/lib/mathjax-fix.html
      - _quarto/lib/pixel-snap.html     # スライドの位置を整数ピクセルに (Safari のぼやけ対策)
    center: true
    controls: true
    controls-layout: bottom-right
    controls-back-arrows: visible
    controls-tutorial: true
    navigation-mode: vertical
    auto-stretch: false
    slide-number: c/t
revealjs-plugins:
  - pointer
pointer:
  color: "rgba(255, 0, 0, 0.4)"
  pointerSize: 120
  alwaysVisible: false
knitr:
  opts_chunk:
    fig.align: center
execute:
  echo: false
  warning: false
  message: false
  fig-height: 5
  fig-width: 5
filters:
  - _quarto/lib/section-toc.lua   # 梗概 {.overview} と節扉に節の一覧を出す
  - _quarto/lib/no-hrule.lua
  - _quarto/lib/iframe.lua
  - _quarto/lib/cite-aside.lua    # 各スライドで引用した文献の書誌を脚注欄に出す
  - _quarto/lib/text-size.lua     # .text-NN / .math-NN を PDF でも効かせる
