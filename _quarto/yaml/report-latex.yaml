# report-latex — 解説文・報告書 (html と LaTeX (lualatex) の PDF)
# 使い方: org の先頭で  #+SETUPFILE: _quarto/org/report-latex.org   (typst 版は report-typst)
#   html: quarto render X.qmd --to html / PDF: quarto render X.qmd --to pdf
# report-typst.yaml と同じ構成で，PDF を typst ではなく LaTeX で作る (日本語は luatexja-preset)．
# LaTeX では csl のパスに _ があっても困らないので，文献の書式 (csl) は html と PDF で共通．
# R のチャンクは図をそのまま使えるよう execute: echo: false
# 文献の表記を英語 (APA) にするため lang は設定せず，見出しの語だけ日本語にする
language:
  title-block-author-single: 著者
  title-block-author-plural: 著者
  title-block-published: 公開日
  toc-title-document: 目次
  section-title-references: 参考文献
  section-title-appendices: 付録
  section-title-abstract: 概要         # #+begin_abstract (front matter の abstract:) の題
  section-title-footnotes: 脚注
  crossref-fig-title: 図
  crossref-tbl-title: 表
  crossref-eq-prefix: 式
  crossref-thm-title: 定理
  crossref-thm-prefix: 定理
  crossref-lem-title: 補題
  crossref-lem-prefix: 補題
  crossref-cor-title: 系
  crossref-cor-prefix: 系
  crossref-prp-title: 命題
  crossref-prp-prefix: 命題
  crossref-def-title: 定義
  crossref-def-prefix: 定義
  crossref-exm-title: 例
  crossref-exm-prefix: 例
  crossref-cnj-title: 予想
  crossref-cnj-prefix: 予想
  crossref-exr-title: 演習
  crossref-exr-prefix: 演習
  crossref-sol-title: 解
  crossref-sol-prefix: 解
  crossref-rem-title: 注意
  crossref-rem-prefix: 注意
  crossref-alg-title: アルゴリズム
  crossref-alg-prefix: アルゴリズム
  environment-proof-title: 証明      # #+begin_proof (番号なし)
  environment-remark-title: 注意     # #+begin_remark
  environment-solution-title: 解     # #+begin_solution
callout-palette: indigo             # pdf と html の callout の役割の色 (lib/callout-colors.lua．org の #+QUARTO_PALETTE で替えられる)
license: "CC BY-NC"
number-sections: true
link-citations: true
csl: _quarto/csl/apa.csl
format:
  html:
    toc: true
    toc-depth: 3
    toc-title: 目次
    embed-resources: true
    html-math-method: mathjax
    fig-width: 6.5
    fig-height: 4.2
    citations-hover: true
    reference-location: margin
    fig-cap-location: bottom
    tbl-cap-location: top
    theme: default
    format-links: false
    fontsize: 1rem
    mainfont: '"Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans JP", "Noto Sans CJK JP", sans-serif'
  pdf:
    pdf-engine: lualatex
    documentclass: scrartcl
    papersize: a4
    fontsize: 10pt
    geometry:
      - top=24mm
      - bottom=24mm
      - left=22mm
      - right=22mm
    toc: true
    toc-depth: 2
    toc-title: 目次
    fig-width: 6
    fig-height: 3.8
    fig-cap-location: bottom
    tbl-cap-location: top
    colorlinks: true
    keep-tex: true
    include-in-header:
      - _quarto/tex/ja-latex.tex          # 和文 (luatexja)・xpatch の回避・mathtools (式の番号)
      - _quarto/tex/theorem-number.tex    # 定理の類の番号を通し番号に (定理 1．html などと同じ)
      - _quarto/tex/koma-abstract.tex     # #+begin_abstract の題「概要」
      - _quarto/tex/table-center.tex
      - _quarto/tex/callout-title-gothic.tex
knitr:
  opts_chunk:
    fig.align: center
    out.width: "85%"
    dev: png
    dpi: 200
    crop: false        # 図の余白を切り詰めない (既定)．PDF (LaTeX) で Quarto は crop を有効にするが，dev: png の図の切り詰めには
                       # R の magick が要り，無いと "The magick package is required to crop" と出る．機械によって図の大きさが
                       # 変わらないよう既定は切る．詰めたい図はチャンクで #+ATTR_QUARTO: :crop true (文書全体は R のチャンクで
                       # knitr::opts_chunk$set(crop = TRUE))．使う機械には magick を入れる: install.packages("magick")
execute:
  echo: false
  warning: false
  message: false
filters:
  - _quarto/lib/cjk-names.lua    # ams-numeric.csl で和文の著者名を「園田翔, 村田昇」に (頭文字の . と and を付けない)
  - _quarto/lib/title-block.lua   # 表題を紀要の形に (#+INSTITUTE / #+EMAIL / #+AUTHOR_EN / #+INSTITUTE_EN があるとき)
  - _quarto/lib/text-center.lua   # #+begin_center (::: {.text-center}) を html / pdf / typst で中央寄せに
  - _quarto/lib/callout-colors.lua # callout を palette の役割の色に (pdf / html．revealjs は scss)
