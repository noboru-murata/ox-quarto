# lecture — 講義用 revealjs＋pdf (lualatex)＋html (既定の配色: indigo-palette)
# 使い方: org の先頭で  #+SETUPFILE: _quarto/org/lecture.org
#   (プロジェクトに _quarto と _extensions をシンボリックリンクで置く．ox-quarto/README.org)
# 配色は大元の org で  #+QUARTO_PALETTE: jade  (indigo (既定) / jade / lavender / burgundy / dracula)．pdf と html は callout の色だけ配色に合わせる (callout-palette)．
#   dracula では表紙の title-bg を外し，コードも dracula 配色にする (ox-quarto-ext-palette-rules)．
# talk.yaml との違い: 表紙に title-bg，節扉は見出しをそのまま出す (section-toc なし)，PDF と html も出せる．
callout-palette: indigo             # pdf と html の callout の色 (lib/callout-colors.lua．#+QUARTO_PALETTE に合わせて書き換わる)
license: "CC BY-NC"
csl: _quarto/csl/apa-short.csl      # 文献の書式 (本文は (著者, 年)．一覧は 4 名以上を 2 名 + et al. に．解説文は apa.csl)
link-citations: true
cite-aside-max: 2                   # 引用が 3 件以上のスライドでは書誌を脚注欄に出さない (lib/cite-aside.lua)
format:
  revealjs: 
    theme:
      - default
      - _quarto/scss/oerreveal.scss          # structure
      - _quarto/scss/indigo-palette.scss     # 配色 (#+QUARTO_PALETTE で差し替わる)
      - _quarto/scss/lecture-deck.scss       # 修飾 (#+QUARTO_DECK の deck はこの後に足される)
      - _quarto/scss/parts.scss              # 部品: .muted .kpi .flow-arrow .formulation など
      - _quarto/scss/iframe.scss
      - _quarto/scss/title-bg.scss
      - _quarto/scss/text-size.scss
    slide-level: 3
    max-scale: 2.0 
    embed-resources: true
    include-in-header:
      - _quarto/lib/mathjax-fix.html
      - _quarto/lib/pixel-snap.html     # スライドの位置を整数ピクセルに (Safari のぼやけ対策)
      - _quarto/lib/slide-number-arrows.html  # 頁番号を矢印の箱の中へ (Safari でも矢印の真ん中に)
    center: true
    controls: true
    controls-layout: bottom-right
    controls-back-arrows: visible
    controls-tutorial: true
    navigation-mode: vertical
    auto-stretch: false
    slide-number: c/t                  # 右下に「頁/総頁」(talk と同じ)
  pdf:
    keep-tex: true
    echo: false
    pdf-engine: lualatex
    papersize: a4                   # 用紙 (Quarto の既定は letter．report / handout も a4)．org から: #+QUARTO_PDF_OPTIONS: papersize:letter
    include-in-header: 
      - text: |
          \usepackage{luatexja-preset}
          \usepackage{mathtools}
          \mathtoolsset{showonlyrefs,showmanualtags}	    
      - _quarto/tex/fig-scale.tex
      - _quarto/tex/table-center.tex
      - _quarto/tex/callout-title-gothic.tex
      - _quarto/tex/gt-table-tight.tex
  html: 
    self-contained: false
    grid: 
      margin-width: 350px
    code-fold: true
revealjs-plugins:
  - pointer
pointer:
  color: "rgba(255, 0, 0, 0.4)"
  pointerSize: 120
  alwaysVisible: false
knitr:
  opts_chunk:
    fig.align: center
execute:
  warning: false
  message: false
  fig-height: 5
  fig-width: 5
filters:                          # 節扉は見出しをそのまま出す (section-toc は使わない)
  - _quarto/lib/no-hrule.lua
  - _quarto/lib/iframe.lua
  - _quarto/lib/cite-aside.lua    # 各スライドで引用した文献の書誌を脚注欄に出す (revealjs のみ)
  - _quarto/lib/ack.lua           # 謝辞の頁の人の一覧 (::: people) を写真・名前・所属の組に
  - _quarto/lib/text-size.lua   # .text-NN / .math-NN を PDF でも効かせる
  - _quarto/lib/slide-notes.lua # 発表者ノートを pdf / html では枠で囲む (slide-notes)
  - _quarto/lib/title-qr.lua    # 表紙の右下の QR コード (revealjs のみ．org の #+QUARTO_QR)
  - _quarto/lib/pin.lua           # .pin-top / .pin-bottom: absolute の要素をキャンバスの端に固定 (title-qr の後に)
  - _quarto/lib/text-center.lua   # #+begin_center (::: {.text-center}) を html / pdf / typst で中央寄せに
  - _quarto/lib/callout-colors.lua # callout を palette の役割の色に (pdf / html．revealjs は scss)
slide-notes-default: box          # 発表者ノート (::: notes) を pdf / html でどう出すか: box / margin / hide / plain (lib/slide-notes.lua．org では #+QUARTO_OPTIONS: slide-notes:margin)
