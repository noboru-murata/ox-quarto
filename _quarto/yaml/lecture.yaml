# lecture — 講義用 revealjs＋pdf (lualatex)＋html (既定の配色: palette-indigo)
# 使い方: org の先頭で  #+SETUPFILE: _quarto/org/lecture.org
#   (プロジェクトに _quarto と _extensions をシンボリックリンクで置く．ox-quarto/README.org)
# 配色は大元の org で  #+QUARTO_PALETTE: jade  (indigo (既定) / jade / lavender / mint / amethyst / garnet / dracula)．pdf と html は callout の色だけ配色に合わせる (callout-palette)．
#   dracula ではコードも dracula 配色にする (ox-quarto-ext-palette-rules)．
# talk.yaml との違い: 節扉は見出しをそのまま出す (section-toc なし)，PDF と html も出せる，pointer (q) は肉球．
callout-palette: indigo             # pdf と html の callout の色 (lib/callout-colors.lua．#+QUARTO_PALETTE に合わせて書き換わる)
# 定理の類 (#+begin_theorem :id "thm-…" など) と証明の見出しの語 (ほかの見出しの語は Quarto の既定のまま)
language:
  crossref-thm-title: 定理
  crossref-thm-prefix: 定理
  crossref-lem-title: 補題
  crossref-lem-prefix: 補題
  crossref-cor-title: 系
  crossref-cor-prefix: 系
  crossref-prp-title: 命題
  crossref-prp-prefix: 命題
  crossref-def-title: 定義
  crossref-def-prefix: 定義
  crossref-exm-title: 例
  crossref-exm-prefix: 例
  crossref-cnj-title: 予想
  crossref-cnj-prefix: 予想
  crossref-exr-title: 演習
  crossref-exr-prefix: 演習
  crossref-sol-title: 解
  crossref-sol-prefix: 解
  crossref-rem-title: 注意
  crossref-rem-prefix: 注意
  crossref-alg-title: アルゴリズム
  crossref-alg-prefix: アルゴリズム
  environment-proof-title: 証明      # #+begin_proof (番号なし)
  environment-remark-title: 注意     # #+begin_remark
  environment-solution-title: 解     # #+begin_solution
license: "CC BY-NC"
csl: _quarto/csl/apa-short.csl      # 文献の書式 (本文は (著者, 年)．一覧は 4 名以上を 2 名 + et al. に．解説文は apa.csl)
link-citations: true
cite-aside-max: 2                   # 引用が 3 件以上のスライドでは書誌を脚注欄に出さない (lib/cite-aside.lua)
format:
  revealjs: 
    theme:
      - default
      - _quarto/scss/oer-revealjs.scss       # structure
      - _quarto/scss/palette-indigo.scss     # 配色 (#+QUARTO_PALETTE で差し替わる)
      - _quarto/scss/deck-lecture.scss       # 修飾
      - _quarto/scss/deck-paw.scss           # pointer (q) を肉球に．丸い点に戻すなら #+QUARTO_DECK: dot (#+QUARTO_DECK の deck はこの後に足される)
      - _quarto/scss/parts.scss              # 部品: .muted .kpi .flow-arrow .formulation など
      - _quarto/scss/iframe.scss
      - _quarto/scss/text-size.scss
    slide-level: 3
    max-scale: 2.0 
    embed-resources: true
    include-in-header:
      - _quarto/lib/mathjax-fix.html
      - _quarto/lib/pixel-snap.html     # スライドの位置を整数ピクセルに (Safari のぼやけ対策)
      - _quarto/lib/slide-number-arrows.html  # 頁番号を矢印の箱の中へ (Safari でも矢印の真ん中に)
    center: true
    controls: true
    controls-layout: bottom-right
    controls-back-arrows: visible
    controls-tutorial: true
    navigation-mode: vertical
    auto-stretch: false
    slide-number: c/t                  # 右下に「頁/総頁」(talk と同じ)
  pdf:
    keep-tex: true
    echo: false
    pdf-engine: lualatex
    papersize: a4                   # 用紙 (Quarto の既定は letter．report / handout も a4)．org から: #+QUARTO_PDF_OPTIONS: papersize:letter
    include-in-header:
      - _quarto/tex/ja-latex.tex          # 和文 (luatexja)・xpatch の回避・mathtools (式の番号)
      - _quarto/tex/theorem-number.tex    # 定理の類の番号を通し番号に (定理 1．html などと同じ)
      - _quarto/tex/fig-scale.tex
      - _quarto/tex/table-center.tex
      - _quarto/tex/callout-title-gothic.tex
      - _quarto/tex/gt-table-tight.tex
  html: 
    self-contained: false
    grid: 
      margin-width: 350px
    code-fold: true
revealjs-plugins:
  - pointer
pointer:
  color: "rgba(255, 0, 0, 0.4)"
  pointerSize: 120
  alwaysVisible: false
knitr:
  opts_chunk:
    fig.align: center
execute:
  warning: false
  message: false
  fig-height: 5
  fig-width: 5
filters:                          # 節扉は見出しをそのまま出す (section-toc は使わない)
  - _quarto/lib/no-hrule.lua
  - _quarto/lib/iframe.lua
  - _quarto/lib/cite-aside.lua    # 各スライドで引用した文献の書誌を脚注欄に出す (revealjs のみ)
  - _quarto/lib/ack.lua           # 謝辞の頁の人の一覧 (::: people) を写真・名前・所属の組に
  - _quarto/lib/text-size.lua   # .text-NN / .math-NN を PDF でも効かせる
  - _quarto/lib/slide-notes.lua # 発表者ノートを pdf / html では枠で囲む (slide-notes)
  - _quarto/lib/title-qr.lua    # 表紙の右下の QR コード (revealjs のみ．org の #+QUARTO_QR)
  - _quarto/lib/pin.lua           # .pin-top / .pin-bottom: absolute の要素をキャンバスの端に固定 (title-qr の後に)
  - _quarto/lib/text-center.lua   # #+begin_center (::: {.text-center}) を html / pdf / typst で中央寄せに
  - _quarto/lib/callout-colors.lua # callout を palette の役割の色に (pdf / html．revealjs は scss)
slide-notes-default: box          # 発表者ノート (::: notes) を pdf / html でどう出すか: box / margin / hide / plain (lib/slide-notes.lua．org では #+QUARTO_OPTIONS: slide-notes:margin)
