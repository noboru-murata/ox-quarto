# handout-typst — Tufte 形式の解説文 (右の余白を広く取り，脚注・引用・図の見出し・小さな図を余白に置く)．PDF は typst
# 使い方: org の先頭で  #+SETUPFILE: _quarto/org/handout-typst.org   (LaTeX 版は handout-latex)
#   PDF (typst): quarto render X.qmd --to typst / html: quarto render X.qmd --to html
# typst の余白のレイアウトは Quarto 同梱の marginalia パッケージ．本文と余白の幅は Quarto (marginalia) が決める．
# typst では csl のパスの _ を扱えないため，文献の書式は html だけ csl，typst は内蔵の apa (bibliographystyle)．
# 手本は Quarto のギャラリーの "A Quarto Page Layout Example (Inspired by Tufte Handout)"．
# Quarto の余白のレイアウト (reference-location / citation-location / fig-cap-location: margin) を使う．
# 余白に置く: 脚注 → 余白の注 (sidenote)，引用 → 余白に書誌，図の見出し → 余白 (表の見出しは表の上)．
#   図を余白に: R のチャンクに #+ATTR_QUARTO: :column "margin"
#   任意の内容を余白に: #+begin_column-margin … #+end_column-margin
#   本文＋余白の幅いっぱい: #+ATTR_QUARTO: :column "page-right" (チャンク)．見出しは図に添えて置かれる
# 文献の表記を英語 (APA) にするため lang は設定せず，見出しの語だけ日本語にする
language:
  title-block-author-single: 著者
  title-block-author-plural: 著者
  title-block-published: 公開日
  toc-title-document: 目次
  section-title-references: 参考文献
  section-title-appendices: 付録
  section-title-footnotes: 脚注
  crossref-fig-title: 図
  crossref-tbl-title: 表
  crossref-eq-prefix: 式
license: "CC BY-NC"
number-sections: false
link-citations: true
reference-location: margin        # 脚注を余白に
citation-location: margin         # 引用した文献の書誌を余白に
fig-cap-location: margin          # 図の見出しを余白に
tbl-cap-location: top             # 表の見出しは表の上 (margin にすると Quarto 1.10 の LaTeX で
                                  #   longtable の中に \sidecaption が入りコンパイルできない)
format:
  typst:
    papersize: a4
    mainfont: "Noto Serif CJK JP"
    fontsize: 10pt
    bibliographystyle: apa        # typst 組み込みの APA
    fig-width: 5
    fig-height: 3.2
    include-in-header:
      - text: |
          #set footnote.entry(separator: none)
          #set bibliography(title: none)
    # ↑ 脚注は余白に出るので，本文の下に残る脚注の区切り線を消す．文献の一覧の見出しは org 側で
  html:
    csl: _quarto/csl/apa.csl
    embed-resources: true
    html-math-method: mathjax
    grid:
      margin-width: 350px         # 余白を広く (html)
    fig-width: 6
    fig-height: 3.8
    theme: default
    format-links: false
    fontsize: 1rem
    mainfont: '"Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans JP", "Noto Sans CJK JP", sans-serif'
knitr:
  opts_chunk:
    fig.align: center
    dev: png
    dpi: 200
execute:
  echo: false
  warning: false
  message: false
