<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流れる点 (背景用)</title>
<!-- iframe-sample.org の background-iframe で使う取り込み用のページ (外部の読み込みなし)．
     暗い地にゆっくり流れる点を描く．窓全体に敷かれるので大きさは窓に合わせる．
     background-interactive="true" のときだけマウスが届き，点がマウスから逃げる． -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1f1a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let w = 0, h = 0, pts = [], mouse = null;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(w * h / 9000);
    pts = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h,
                                            r: 1 + Math.random() * 2, s: 0.2 + Math.random() * 0.6 }));
  }
  function frame(ts) {
    ctx.fillStyle = 'rgba(11, 31, 26, 0.35)'; ctx.fillRect(0, 0, w, h);   // 薄く塗り重ねて尾を引く
    for (const p of pts) {
      // ゆるやかな渦の流れ
      const a = Math.sin(p.y / 140 + ts / 4000) + Math.cos(p.x / 180 - ts / 5000);
      p.x += Math.cos(a) * p.s; p.y += Math.sin(a) * p.s;
      if (mouse) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < 120 * 120) { const k = (120 * 120 - d2) / (120 * 120) * 3; p.x += dx / Math.sqrt(d2 + 1) * k; p.y += dy / Math.sqrt(d2 + 1) * k; }
      }
      if (p.x < 0) p.x += w; if (p.x > w) p.x -= w; if (p.y < 0) p.y += h; if (p.y > h) p.y -= h;
      ctx.fillStyle = `rgba(110, 231, 183, ${0.25 + p.s * 0.6})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; });
  addEventListener('mouseleave', () => { mouse = null; });
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
