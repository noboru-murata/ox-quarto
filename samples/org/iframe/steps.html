<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>段を持つデモ (頁送りで進める)</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; color: #222; display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header { padding: 8px 14px; background: #eef2f0; font-size: 14px; }
  nav { padding: 6px 14px; display: flex; gap: 6px; }
  nav button[aria-current] { font-weight: bold; }
  html.embed header, html.embed nav { display: none; }   /* 埋め込みのときは帯とボタンを隠す (段は頁送りで) */
  svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<header>段を持つデモ: 部分和 1 + 1/2 + 1/4 + … を 1 段ずつ足す (単独で開くとボタンと ← → で動かせる)</header>
<nav id="nav"></nav>
<svg viewBox="0 0 1060 220" id="fig"></svg>
<script>
  // 段: 0 … N-1．window.demoSteps (next / prev / start / end) は embed-steps.js がスライドの頁送りから呼ぶ
  const N = 5, fig = document.getElementById('fig'), nav = document.getElementById('nav');
  let i = 0;
  for (let k = 0; k < N; k++) {
    const b = document.createElement('button'); b.textContent = `${k + 1}`;
    b.onclick = () => { i = k; draw(); }; nav.append(b);
  }
  function draw() {
    let x = 20, w = 512, s = '';
    for (let k = 0; k <= i; k++) {
      s += `<rect x="${x}" y="80" width="${w}" height="60" fill="hsl(${150 + 30 * k},45%,55%)" stroke="#fff"/>`;
      s += `<text x="${x + w / 2}" y="117" font-size="${Math.max(10, 22 - 3 * k)}" text-anchor="middle" fill="#fff">1/${2 ** k}</text>`;
      x += w; w /= 2;
    }
    let sum = 2 - 1 / 2 ** i;
    s += `<text x="20" y="40" font-size="20">${i + 1} 項までの和 = ${sum}</text>`;
    s += `<line x1="1044" y1="70" x2="1044" y2="150" stroke="#999"/>`;
    fig.innerHTML = s;
    [...nav.children].forEach((b, k) => k === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
    window.embedCaption && embedCaption(`段 ${i + 1} / ${N}`);
  }
  window.demoSteps = {
    next() { if (i < N - 1) { i++; draw(); return true; } return false; },
    prev() { if (i > 0) { i--; draw(); return true; } return false; },
    start() { i = 0; draw(); },
    end() { i = N - 1; draw(); },
  };
  addEventListener('keydown', e => {          // 単独で開いたとき (埋め込みでは embed-steps.js が先に受ける)
    if (e.key === 'ArrowRight') demoSteps.next(); else if (e.key === 'ArrowLeft') demoSteps.prev();
  });
</script>
<script src="embed-steps.js"></script>
<script>draw();</script>
</body>
</html>
